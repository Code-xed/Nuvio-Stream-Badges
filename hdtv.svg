<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background square -->
  <rect x="0" y="0" width="128" height="128" fill="#FF6B35" rx="8"/>
  
  <!-- TV screen -->
  <rect x="28" y="32" width="72" height="56" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
  
  <!-- Screen scanlines -->
  <line x1="35" y1="45" x2="93" y2="45" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <line x1="35" y1="55" x2="93" y2="55" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <line x1="35" y1="65" x2="93" y2="65" stroke="#fff" stroke-width="2" opacity="0.8"/>
  
  <!-- Antenna left -->
  <line x1="42" y1="28" x2="32" y2="12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna right -->
  <line x1="86" y1="28" x2="96" y2="12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
</svg>